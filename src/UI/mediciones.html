<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mediciones</title>

  <!-- CSS de DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

  <!-- Tu CSS separado -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1>Listado de Mediciones</h1>

  <button id="recargarBtn">🔄 Recargar tabla</button>

  <table id="tablaMediciones" class="display" style="width:100%">
    <thead>
      <tr>
        <th>ID de la medición</th>
        <th>Contador</th>
        <th>Medición</th>
        <th>Unidad</th>
        <th>Hora</th>
        <th>Localización</th>
        <th>Nombre del usuario</th>
        <th>Apellidos del usuario</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- JS de DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    const API_URL = "http://localhost:3000/mediciones";
    let tabla;

    async function cargarMediciones() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Error al obtener los datos");
        const mediciones = await response.json();

        if (tabla) {
          tabla.clear().rows.add(mediciones).draw(); // Recarga sin recrear la tabla
        } else {
          tabla = $('#tablaMediciones').DataTable({
            data: mediciones,
            columns: [
              { data: 'id' },
              { data: 'contador' },
              { data: 'medicion' },
              { data: 'tipo_unidad' },
              { data: 'hora' },
              { data: 'localizacion' },
              { data: 'user_nombre' },
              { data: 'user_apellidos' }
            ],
            language: {
              url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
            }
          });
        }
      } catch (error) {
        console.error(error);
        alert("❌ Error al cargar las mediciones. Verifica que la API esté activa.");
      }
    }

    document.getElementById("recargarBtn").addEventListener("click", cargarMediciones);

    // Carga inicial
    cargarMediciones();
  </script>

  <!-- Script de test -->
  <script src="test.js"></script>
</body>
</html>
